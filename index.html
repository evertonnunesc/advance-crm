<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advance CRM | Inteligência Comercial</title>
<style>
:root{--navy:#142d48;--navy2:#1c3c5c;--green:#24966b;--bg:#f3f6f8;--surface:#fff;--text:#1d2935;--muted:#718096;--line:#e4eaf0;--red:#c84d4d;--amber:#b7791f;--shadow:0 8px 24px rgba(20,45,72,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:248px;background:var(--navy);color:#fff;padding:22px 15px;display:flex;flex-direction:column;z-index:5}.brand{display:flex;align-items:center;gap:11px;padding:3px 9px 25px}.brand-mark{width:39px;height:39px;border-radius:11px;background:var(--green);display:grid;place-items:center;font-weight:800;font-size:20px}.brand strong{display:block;font-size:15px;letter-spacing:.7px}.brand small{color:#a9bdce;font-size:10px;letter-spacing:1.2px}.nav-label{font-size:10px;color:#89a2b8;letter-spacing:1.4px;padding:12px 12px 7px}.nav button{width:100%;border:0;background:transparent;color:#d5e0e9;padding:11px 12px;text-align:left;border-radius:8px;margin:2px 0;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:#254663;color:#fff}.nav .ico{width:18px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;border-top:1px solid #34516b;padding:15px 10px 0;color:#a9bdce;font-size:11px}.main{margin-left:248px;min-height:100vh}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:4}.crumb{color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:10px}.avatar{width:32px;height:32px;background:#e2f1eb;color:#18734f;border-radius:50%;display:grid;place-items:center;font-weight:700}.content{padding:28px 30px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:22px}.page-head h1{margin:0 0 5px;font-size:24px;color:var(--navy)}.page-head p{margin:0;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:8px;font-weight:600;display:inline-flex;gap:7px;align-items:center}.btn:hover{background:#f7fafc}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.dark{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.danger{color:var(--red);border-color:#f5d2d2;background:#fdf2f2}.btn.danger:hover{background:#fae1e1}.btn.small{padding:6px 9px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:var(--shadow)}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon{width:31px;height:31px;border-radius:9px;background:#edf6f2;color:var(--green);display:grid;place-items:center}.stat strong{display:block;font-size:27px;color:var(--navy);margin:10px 0 1px}.stat small{color:var(--muted)}.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);min-width:0}.panel h3{margin:0 0 15px;font-size:15px;color:var(--navy)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:760px}th{text-align:left;color:#7b8997;font-size:10px;text-transform:uppercase;letter-spacing:.7px;background:#f8fafb;padding:11px 12px;white-space:nowrap}td{padding:12px;border-top:1px solid var(--line);vertical-align:middle}tbody tr:hover{background:#fbfcfd}.muted{color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:30px;background:#edf1f5;color:#536273;font-size:11px;font-weight:650;white-space:nowrap}.pill.green{background:#e4f4ec;color:#19734e}.pill.amber{background:#fff4dc;color:#98650d}.pill.red{background:#fdeaea;color:#a43e3e}.pill.blue{background:#e8f1fb;color:#315f91}.pill.purple{background:#f3e8fb;color:#7b3191}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{font-size:12px;font-weight:650;color:#526171}.field input,.field select,.field textarea,.toolbar input,.toolbar select{border:1px solid #dce4eb;border-radius:8px;padding:9px 10px;background:#fff;color:var(--text);outline:none;min-width:0}.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus{border-color:#69ad91;box-shadow:0 0 0 3px #e4f3ec}.toolbar input{min-width:220px}.toolbar select{min-width:150px}.empty{padding:35px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--navy);margin-bottom:5px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field.full{grid-column:1/-1}.field textarea{min-height:78px;resize:vertical}.modal-back{position:fixed;inset:0;background:rgba(13,29,44,.48);z-index:10;display:none;align-items:center;justify-content:center;padding:18px}.modal-back.show{display:flex}.modal{background:#fff;border-radius:14px;width:min(950px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 70px #071a2b55}.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0;color:var(--navy);font-size:18px}.modal-body{padding:20px 22px}.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:9px}.close{border:0;background:transparent;font-size:22px;color:var(--muted)}.notice{background:#eef6f3;border:1px solid #d4e9df;color:#28684f;padding:12px 14px;border-radius:9px;margin-bottom:16px}.notice.warn{background:#fff7e8;border-color:#f4e3bc;color:#8b641a}.activity-card{border-left:2px solid var(--line);margin-left:7px;padding:8px 0 8px 17px;position:relative;cursor:pointer;transition:0.15s}.activity-card:hover{opacity:0.8}.activity-card:before{content:"";position:absolute;width:9px;height:9px;background:var(--green);border-radius:50%;left:-5.5px;top:12px}.activity-card.done{opacity:0.5;text-decoration:line-through;border-left-color:var(--red)}.activity-card.done:before{background:var(--red)}.bar-row{display:grid;grid-template-columns:160px 1fr 35px;align-items:center;gap:10px;margin:13px 0;font-size:12px}.bar{height:8px;background:#edf1f4;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:20px}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.hide{display:none!important}.mobile-menu{display:none}

.product-item-row { background: #f8fafb; border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 10px; position: relative; }
.product-item-grid { display: grid; grid-template-columns: 2fr 3fr 1fr 1fr 1fr 1fr 1.2fr auto; gap: 8px; align-items: end; }
.contact-item-grid { display: grid; grid-template-columns: 2fr 2fr 2fr 1.5fr auto; gap: 8px; align-items: end; }
@media(max-width: 1100px) { .product-item-grid, .contact-item-grid { grid-template-columns: 1fr; } }

/* Kanban Styles */
.kanban-board { display: grid; grid-template-columns: repeat(7, minmax(240px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 15px; align-items: start; }
.kanban-col { background: #f8fafb; border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-height: 500px; display: flex; flex-direction: column; }
.kanban-col h4 { margin: 0 0 12px 0; font-size: 13px; color: var(--navy); display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--line); padding-bottom: 8px; }
.kanban-cards { display: flex; flex-direction: column; gap: 10px; min-height: 400px; }
.kanban-card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 12px; box-shadow: 0 2px 5px rgba(0,0,0,.04); cursor: grab; transition: transform .1s; }
.kanban-card:active { cursor: grabbing; }
.kanban-card:hover { border-color: var(--navy); }
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-mark">A</div><div><strong>ADVANCE TINTAS</strong><small>Desenvolvido por: Everton Nunes</small></div></div>
  <div class="nav-label">GESTÃO COMERCIAL</div>
  <nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
    <button data-page="opportunities"><span class="ico">◎</span>Oportunidades</button>
    <button data-page="petronect"><span class="ico">◈</span>Petronect</button>
    <button data-page="companies"><span class="ico">▣</span>Empresas</button>
    <button data-page="contacts"><span class="ico">♙</span>Contatos</button>
    <button data-page="activities"><span class="ico">◷</span>Histórico de atividades</button>
    <button data-page="vendor"><span class="ico">✓</span>Vendor List</button>
  </nav>
  <div class="nav-label">SISTEMA</div>
  <nav class="nav"><button data-page="reports"><span class="ico">▤</span>Relatórios</button><button data-page="settings"><span class="ico">⚙</span>Backup e configurações</button></nav>
  <div class="side-bottom">Advance CRM · Versão 2.2<br>Dados armazenados neste navegador</div>
</aside>
<main class="main">
  <header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobile-menu" id="menuBtn">☰</button><span class="crumb">Advance Tintas / <b id="crumb">Dashboard</b></span></div><div class="top-actions"><span class="muted" style="font-size:12px">Modo offline</span><div class="avatar">A</div></div></header>
  <section class="content" id="content"></section>
</main>
</div>
<div class="modal-back" id="modalBack">
 <div class="modal">
  <div class="modal-head"><h2 id="modalTitle">Cadastro</h2><button class="close" id="modalCloseBtn">×</button></div>
  <div class="modal-body" id="modalBody"></div>
  <div class="modal-foot" id="modalFoot">
   <button class="btn" id="modalCancelBtn">Cancelar</button>
   <button class="btn primary" id="modalSaveBtn">Salvar registro</button>
  </div>
 </div>
</div>
<input type="file" id="importFile" accept=".json,application/json" class="hide">
<script>
const DBKEY='advance_crm_v1';
const emptyDB=()=>({opportunities:[],petronect:[],companies:[],contacts:[],activities:[]});
let db=loadDB(),page='dashboard',modalSaveFn=null;

function loadDB(){try{return {...emptyDB(),...JSON.parse(localStorage.getItem(DBKEY)||'{}')}}catch(e){return emptyDB()}}
function saveDB(){localStorage.setItem(DBKEY,JSON.stringify(db));}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'—';
const money=v=>v?Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'—';

function maskCNPJ(v){
 v = v.replace(/\D/g,"").slice(0,14);
 v = v.replace(/^(\d{2})(\d)/,"$1.$2");
 v = v.replace(/^(\d{2})\.(\d{3})(\d)/,"$1.$2.$3");
 v = v.replace(/\.(\d{3})(\d)/,".$1/$2");
 v = v.replace(/(\d{4})(\d)/,"$1-$2");
 return v;
}
function maskPhone(v){
 v = v.replace(/\D/g,"").slice(0,11);
 if(v.length > 10){
  v = v.replace(/^(\d{2})(\d{5})(\d{4}).*/,"($1) $2-$3");
 } else if(v.length > 5){
  v = v.replace(/^(\d{2})(\d{4})(\d{0,4}).*/,"($1) $2-$3");
 } else if(v.length > 2){
  v = v.replace(/^(\d{2})(\d{0,5})/,"($1) $2");
 } else if(v.length > 0){
  v = v.replace(/^(\d*)/,"($1");
 }
 return v;
}

function generateCustomId(prefix, list){
 const now = new Date();
 const month = String(now.getMonth() + 1).padStart(2, '0');
 const year = now.getFullYear();
 const base = prefix + month + year;
 const matching = list.filter(item => item.id && item.id.startsWith(base));
 const seq = matching.length + 1;
 return base + String(seq).padStart(4, '0');
}

const statusOptions=['Novo lead','Pesquisa em andamento','Contato identificado','Primeiro contato feito','Em negociação','Cotação solicitada','Proposta enviada','Homologação','Vendor List aprovado','Sem retorno','Perdido','Cliente ativo','Reativar futuramente'];
const petronectStatusOptions=['Declinada','Analisando','Sala de colaboração','Postada','Ganha','Perdida','Encerrada'];
const vendorOptions=['Não iniciado','Mapear requisitos','Documentação enviada','Em análise','Aprovado','Reprovado','Não se aplica'];

const pillClass=s=>['Cliente ativo','Vendor List aprovado','Aprovado','Ganha','Postada'].includes(s)?'green':['Perdido','Reprovado','Declinada','Perdida'].includes(s)?'red':['Em negociação','Homologação','Em análise','Documentação enviada','Sala de colaboração'].includes(s)?'amber':['Analisando','Encerrada'].includes(s)?'purple':'blue';

function setPage(p){page=p;$('#sidebar').classList.remove('open');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});
document.querySelectorAll('.nav button[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');

function closeModal(){$('#modalBack').classList.remove('show');modalSaveFn=null;}
$('#modalCloseBtn').onclick = closeModal;
$('#modalCancelBtn').onclick = closeModal;
$('#modalSaveBtn').onclick = () => { if(modalSaveFn) modalSaveFn(); };

function openModal(title,body,save,customFoot=''){
 $('#modalTitle').textContent=title;
 $('#modalBody').innerHTML=body;
 modalSaveFn=save;
 
 let foot=$('#modalFoot');
 if(customFoot){
  foot.innerHTML=customFoot;
 } else {
  foot.innerHTML=`<button class="btn" id="modalCancelBtn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="modalSaveBtn">Salvar registro</button>`;
  $('#modalSaveBtn').onclick = () => { if(modalSaveFn) modalSaveFn(); };
 }
 $('#modalBack').classList.add('show');
}

function head(title,sub,action=''){return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function stat(label,value,icon,sub){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><strong>${value}</strong><small>${sub}</small></div>`}
function render(){const names={dashboard:'Dashboard',opportunities:'Oportunidades',petronect:'Petronect',companies:'Empresas',contacts:'Contatos','activities':'Histórico de atividades',vendor:'Vendor List',reports:'Relatórios',settings:'Backup e configurações'};$('#crumb').textContent=names[page]||'Dashboard';const root=$('#content');({dashboard:dashboardPage,opportunities:opportunitiesPage,petronect:petronectPage,companies:companiesPage,contacts:contactsPage,activities:activitiesPage,vendor:vendorPage,reports:reportsPage,settings:settingsPage}[page]||dashboardPage)(root)}

function dashboardPage(root){
 const open=db.opportunities.filter(o=>!['Perdido','Cliente ativo'].includes(o.status)&&!o.done).length;
 const overdue=db.opportunities.filter(o=>o.nextDate&&o.nextDate<today()&&!['Perdido','Cliente ativo'].includes(o.status)&&!o.done).length;
 const petronectActive=db.petronect.filter(p=>!['Declinada','Ganha','Perdida','Encerrada'].includes(p.status)).length;
 const recent=[...db.activities].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,6);
 
 let oppDue=db.opportunities.filter(o=>o.nextDate&&!o.done&&!['Perdido','Cliente ativo'].includes(o.status)).map(o=>({type:'opp', id:o.id, title:o.company||'Empresa não informada', date:o.nextDate, desc:o.nextAction||'Follow-up'}));
 let petronectDue=db.petronect.filter(p=>p.closingDate&&p.status!=='Declinada'&&!['Ganha','Perdida','Encerrada'].includes(p.status)).map(p=>{
  let isExpired = p.closingDate < today();
  let isTomorrow = (new Date(p.closingDate+'T12:00:00') - new Date(today()+'T12:00:00') === 86400000);
  let alertType = isExpired ? 'Vencido' : (isTomorrow ? 'Vence Amanhã' : 'Agendado');
  return {type:'petronect', id:p.id, title:'Petronect: '+p.opportunity, date:p.closingDate, desc:'Encerramento edital', alertType};
 });

 let combinedDue = [...oppDue, ...petronectDue].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8);

 root.innerHTML=head('Painel de prospecção','Acompanhe sua carteira, atividades e evolução comercial.',`<button class="btn primary" onclick="openOpportunity()">＋ Nova oportunidade</button>`)+
 `<div class="cards">${stat('Empresas cadastradas',db.companies.length,'▣','Base de empresas')}${stat('Oportunidades abertas',open,'◎','Em andamento')}${stat('Editais Petronect Ativos',petronectActive,'◈','Monitoramento')}${stat('Follow-ups atrasados',overdue,'◷','Precisam de atenção')}</div>
 <div class="grid2">
  <div class="panel"><h3>Pipeline comercial</h3>${statusOptions.slice(0,9).map(s=>{let n=db.opportunities.filter(o=>o.status===s&&!o.done).length;return `<div class="bar-row"><span>${esc(s)}</span><div class="bar"><i style="width:${db.opportunities.length?100*n/db.opportunities.length:0}%"></i></div><b>${n}</b></div>`}).join('')||'<div class="empty">Cadastre oportunidades para visualizar o pipeline.</div>'}</div>
  <div class="panel"><h3>Próximos acompanhamentos e Prazos</h3>${combinedDue.length?combinedDue.map(item=>{
   let isExp = item.date < today();
   let isTom = item.date === new Date(new Date().getTime()+86400000).toISOString().slice(0,10);
   let cardStyle = isExp ? 'background:#fdeaea;border-left:2px solid var(--red);' : (isTom ? 'background:#fffbe6;border-left:2px solid var(--amber);' : '');
   let badgeText = isExp ? 'Vencido' : (isTom ? 'Vence Amanhã' : 'Agendado');
   let badgeClass = isExp ? 'red' : (isTom ? 'amber' : 'blue');
   
   return `<div class="activity-card" style="${cardStyle}" onclick="${item.type==='opp'?'openOpportunity(\''+item.id+'\')':'openPetronectModal(\''+item.id+'\')'}">
    <div style="display:flex;justify-content:space-between;align-items:center;">
     <strong>${esc(item.title)}</strong>
     ${item.type==='opp'?`<button class="btn small" onclick="event.stopPropagation(); toggleOpportunityDone('${item.id}')" title="Concluir">✓</button>`:''}
    </div>
    <small>${fmtDate(item.date)} · ${esc(item.desc)}</small>
    <div style="margin-top:5px"><span class="pill ${badgeClass}">${badgeText}</span> <span class="pill" style="font-size:10px;">${item.type==='petronect'?'Edital Petronect':'Oportunidade'}</span></div>
   </div>`;
  }).join(''):'<div class="empty"><b>Nenhum acompanhamento pendente</b>Suas tarefas e prazos estão em dia!</div>'}</div>
 </div>
 <div class="panel" style="margin-top:16px"><h3>Atividades recentes</h3>${recent.length?`<div class="table-wrap"><table><thead><tr><th>Data</th><th>Empresa</th><th>Atividade</th><th>Resultado</th></tr></thead><tbody>${recent.map(a=>`<tr><td>${fmtDate(a.date)}</td><td>${esc(a.company)}</td><td>${esc(a.type)}</td><td>${esc(a.summary||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Seu histórico aparecerá aqui conforme você registrar contatos.</div>'}</div>`;
}

function toolbar(placeholder,filters=''){return `<div class="toolbar"><input id="search" placeholder="${placeholder}">${filters}<button class="btn small" onclick="exportCSVCurrent()">⇩ Exportar CSV</button></div>`}

function opportunitiesPage(root){
 root.innerHTML=head('Oportunidades','Registre licitações, contratos, projetos e potenciais negócios.',`<button class="btn primary" onclick="openOpportunity()">＋ Nova oportunidade</button>`)+toolbar('Buscar empresa, produto, processo ou CNPJ...',`<select id="statusFilter"><option value="">Todos os status</option>${statusOptions.map(s=>`<option>${s}</option>`).join('')}</select><select id="priorityFilter"><option value="">Todas prioridades</option><option>Alta</option><option>Média</option><option>Baixa</option></select>`)+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Status</th><th>ID</th><th>Empresa / oportunidade</th><th>Produtos / Itens</th><th>Origem / processo</th><th>Potencial</th><th>Status</th><th>Próximo contato</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div></div>`;
 const draw=()=>{
  let q=$('#search').value.toLowerCase(),s=$('#statusFilter').value,p=$('#priorityFilter').value;
  let arr=db.opportunities.filter(o=>{
   let prodText=(o.products||[]).map(i=>i.name+' '+i.desc).join(' ');
   let matchText=[o.id,o.company,prodText,o.process,o.cnpj,o.source,o.address].join(' ').toLowerCase();
   return matchText.includes(q)&&(!s||o.status===s)&&(!p||o.priority===p);
  });
  $('#rows').innerHTML=arr.length?arr.map(o=>`
   <tr style="${o.done?'opacity:0.5;background:#f9f9f9;':''}">
    <td style="text-align:center;"><input type="checkbox" ${o.done?'checked':''} onchange="toggleOpportunityDone('${o.id}')" title="Marcar como concluído"></td>
    <td><code style="font-size:12px;background:#edf1f5;padding:2px 6px;border-radius:4px;color:var(--navy);font-weight:700;">${esc(o.id)}</code></td>
    <td><b style="${o.done?'text-decoration:line-through;':''}">${esc(o.company||'Sem empresa')}</b><div class="muted">${esc(o.city||'')}${o.uf?'/'+esc(o.uf):''} · ${esc(o.segment||'')}</div></td>
    <td>${esc((o.products||[]).length > 0 ? `${o.products.length} item(ns)` : '0')}</td>
    <td>${esc(o.source||'—')}<div class="muted">${esc(o.process||'')}</div></td>
    <td><span class="pill ${o.priority==='Alta'?'green':''}">${esc(o.priority||'—')}</span></td>
    <td><span class="pill ${pillClass(o.status)}">${esc(o.status)}</span></td>
    <td>${fmtDate(o.nextDate)}</td>
    <td>

function addPetronectItem(){
 currentPetronectItems.push({item:'', summary:'', qty:1, unit:'UN', volume:1, color:'', obs:''});
 renderPetronectItems();
}

function removePetronectItem(index){
 currentPetronectItems.splice(index, 1);
 renderPetronectItems();
}

function updatePetronectItem(index, fieldName, val){
 if(currentPetronectItems[index]){
  currentPetronectItems[index][fieldName] = val;
  if(['qty','unit','volume'].includes(fieldName)){
   let row = document.querySelector(`.product-item-row[data-index="${index}"]`);
   if(row){
    let item = currentPetronectItems[index];
    let unitLower = (item.unit||'').toLowerCase();
    let computed = (unitLower.includes('litro') || unitLower.includes('ml') || unitLower.includes('mililitro')) ? ((Number(item.qty)||0) / (Number(item.volume)||1)).toFixed(2) : (item.qty||0);
    row.querySelector('b').textContent = computed + ' (' + item.unit + ')';
   }
  }
 }
}

function calcPetronectTotal(item){
 let unitLower = (item.unit||'').toLowerCase();
 if(unitLower.includes('litro') || unitLower.includes('mililitro') || unitLower.includes('ml')){
  let q = Number(item.qty)||0;
  let v = Number(item.volume)||1;
  return (q / v).toFixed(2) + ' (Convertido)';
 }
 return (item.qty||0) + ' ' + (item.unit||'UN');
}

function computeQuarter(dateStr){
 if(!dateStr) return '';
 let month = parseInt(dateStr.split('-')[1], 10);
 if(month >= 1 && month <= 3) return 'Q1';
 if(month >= 4 && month <= 6) return 'Q2';
 if(month >= 7 && month <= 9) return 'Q3';
 return 'Q4';
}

function renderReportsData(){
 let selYear = $('#reportYearFilter')?.value || String(new Date().getFullYear());
 let filteredOpps = db.opportunities.filter(o => (o.created||today()).startsWith(selYear));

 let totalOpps = filteredOpps.length;
 let totalVal = filteredOpps.reduce((acc,o)=> acc + (Number(o.value)||0), 0);
 let activeClients = filteredOpps.filter(o=>o.status==='Cliente ativo').length;
 let lostOpps = filteredOpps.filter(o=>o.status==='Perdido').length;
 let conversionRate = totalOpps > 0 ? ((activeClients / totalOpps) * 100).toFixed(1) : 0;

 const weights = {'Novo lead':0.1, 'Pesquisa em andamento':0.2, 'Contato identificado':0.3, 'Primeiro contato feito':0.4, 'Em negociação':0.5, 'Cotação solicitada':0.7, 'Proposta enviada':0.8, 'Homologação':0.85, 'Vendor List aprovado':0.9, 'Cliente ativo':1.0, 'Perdido':0, 'Sem retorno':0.1, 'Reativar futuramente':0.1};
 let weightedVal = filteredOpps.reduce((acc,o)=>{
  let w = weights[o.status] ?? 0.3;
  return acc + ((Number(o.value)||0) * w);

function val(id){return document.getElementById(id)?.value?.trim()||''}
function field(label,id,value='',type='text',opts=null,full=false){
 let input='';
 if(opts){
  input=`<select id="${id}">${opts.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
 } else if(type==='textarea'){
  input=`<textarea id="${id}">${esc(value)}</textarea>`;
 } else {
  let onEv = '';
  if(id.includes('cnpj') || id === 'c_cnpj' || id === 'o_cnpj' || id === 'o_buyer_cnpj') onEv = `oninput="this.value=maskCNPJ(this.value)"`;
  if(id.includes('phone') || id === 'c_phone' || id === 'o_phone' || id.includes('phone')) onEv = `oninput="this.value=maskPhone(this.value)"`;
  input=`<input id="${id}" type="${type}" value="${esc(value)}" ${onEv}>`;
 }
 return `<div class="field ${full?'full':''}"><label>${label}</label>${input}</div>`;
}

function removeProductItem(index){ currentProductsList.splice(index, 1); renderProductItems(); }
function updateProductItem(index, fieldName, val){
 if(currentProductsList[index]){
  currentProductsList[index][fieldName] = val;
  if(fieldName === 'qty' || fieldName === 'unitValue'){
   let row = document.querySelector(`.product-item-row[data-index="${index}"]`);

     ${field('Papel na compra','ct_rolebuy',c.rolebuy||'Compras','text',['Compras','Suprimentos','Engenharia','Manutenção','Obras','Comercial','Diretoria','Cadastro de fornecedores','Outro'])}
    </div>
   </div>
   <div style="background:#f8fafb;border:1px solid var(--line);border-radius:10px;padding:15px;">
    <h3 style="margin:0 0 12px 0;font-size:14px;color:var(--navy);border-bottom:1px solid var(--line);padding-bottom:6px;">📞 2. Comunicação e Detalhes</h3>
    <div class="form-grid">
     ${field('Telefone','ct_phone',c.phone,'tel')}
     ${field('E-mail','ct_email',c.email,'email')}
     ${field('LinkedIn','ct_link',c.linkedin,'url')}
     ${field('Canal preferido','ct_channel',c.channel||'E-mail','text',['E-mail','Telefone','WhatsApp','LinkedIn','Portal','Presencial'])}
     ${field('Última validação','ct_date',c.lastDate||today(),'date')}
     <div class="field full">${field('Observações','ct_notes',c.notes,'textarea',null,true)}</div>
    </div>
   </div>
  </div>
 `,()=>{let name=val('ct_name');if(!name){alert('Informe o nome do contato.');return}let recordId = c.id ? c.id : generateCustomId('CT', db.contacts);let d={id:recordId,name,company:val('ct_company'),role:val('ct_role'),rolebuy:val('ct_rolebuy'),phone:val('ct_phone'),email:val('ct_email'),linkedin:val('ct_link'),channel:val('ct_channel'),lastDate:val('ct_date'),notes:val('ct_notes')};if(c.id)db.contacts=db.contacts.map(x=>x.id===id?d:x);else db.contacts.unshift(d);saveDB();closeModal();render()})
}
function editContact(id){openContact(id)}

function openActivity(oppId = null){
 let opp = oppId ? db.opportunities.find(o => o.id === oppId) : null;
 let defaultCompany = opp ? opp.company : '';
 let defaultContact = opp ? opp.contact : '';
 let defaultNext = opp ? opp.nextAction : '';
 let defaultNextDate = opp ? opp.nextDate : today();

 openModal('Registrar atividade',`
  <div style="display:flex;flex-direction:column;gap:20px;">
   <div style="background:#f8fafb;border:1px solid var(--line);border-radius:10px;padding:15px;">
    <h3 style="margin:0 0 12px 0;font-size:14px;color:var(--navy);border-bottom:1px solid var(--line);padding-bottom:6px;">📌 1. Dados da Atividade</h3>
    <div class="form-grid">
     ${field('Data','a_date',today(),'date')}
     ${field('Tipo de atividade','a_type','Ligação','text',['Pesquisa','Ligação','E-mail','WhatsApp','LinkedIn','Reunião','Envio de apresentação','Cotação','Follow-up','Homologação','Outro'])}
     ${field('Empresa','a_company',defaultCompany)}
     ${field('Contato','a_contact',defaultContact)}
    </div>
   </div>
   <div style="background:#f8fafb;border:1px solid var(--line);border-radius:10px;padding:15px;">
    <h3 style="margin:0 0 12px 0;font-size:14px;color:var(--navy);border-bottom:1px solid var(--line);padding-bottom:6px;">📋 2. Detalhes e Próximos Passos</h3>
    <div class="form-grid">
     <div class="field full">${field('Resumo / resultado','a_summary','','textarea',null,true)}</div>
     <div class="field full">${field('Objeção / necessidade identificada','a_objection','','textarea',null,true)}</div>
     <div class="field full">${field('Próximo passo','a_next',defaultNext,'textarea',null,true)}</div>
     ${field('Nova data do próximo contato','a_nextdate',defaultNextDate,'date')}
    </div>
   </div>
  </div>
 `,()=>{
  let company=val('a_company');
  if(!company){alert('Informe a empresa.');return}

  let recordId = generateCustomId('AT', db.activities);
  let nextDateVal = val('a_nextdate');
  let nextStepVal = val('a_next');

  db.activities.unshift({
   id:recordId,
   date:val('a_date'),
   company,
   contact:val('a_contact'),
   type:val('a_type'),
   summary:val('a_summary'),
   objection:val('a_objection'),
   next:nextStepVal,
   done:false
  });

  let oppMatch = db.opportunities.find(o => o.company.toLowerCase() === company.toLowerCase() || o.id === oppId);
  if(oppMatch){
   oppMatch.lastContact = val('a_date');
   if(nextStepVal) oppMatch.nextAction = nextStepVal;
   if(nextDateVal) oppMatch.nextDate = nextDateVal;
  }

  saveDB(); closeModal(); render();
 });
}

function backup(){let blob=new Blob([JSON.stringify({...db,backupDate:new Date().toISOString(),app:'Advance CRM'},null,2)],{type:'application/json'});downloadBlob(blob,'advance_crm_backup_'+today()+'.json')}
function downloadBlob(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(!data||!Array.isArray(data.opportunities))throw Error();if(confirm('A restauração substituirá todos os dados atuais. Deseja continuar?')){db={...emptyDB(),...data};saveDB();render();alert('Backup restaurado com sucesso.')}}catch(err){alert('Arquivo inválido ou incompatível.')}e.target.value=''};r.readAsText(f)};
function exportCSV(rows,name){if(!rows.length){alert('Não há registros para exportar.');return}let keys=Object.keys(rows[0]),csv=[keys.join(';'),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(';'))].join('\r\n');downloadBlob(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),name)}
function exportCSVCurrent(){
 if(page==='opportunities')exportCSV(db.opportunities,'advance_oportunidades.csv');
 else if(page==='petronect')exportCSV(db.petronect,'advance_petronect.csv');
 else if(page==='companies')exportCSV(db.companies,'advance_empresas.csv');
 else if(page==='contacts')exportCSV(db.contacts,'advance_contatos.csv');
 else if(page==='activities')exportCSV(db.activities,'advance_atividades.csv');
}

document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
render();
</script>
</body>
</html>
